server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Relative Redirects for Custom Ports / Proxies
    absolute_redirect off;
    port_in_redirect off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml+rss image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root Directory
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Case-insensitive / normalized Sprint route rewrites
    location ~* ^/sprint-01/?$ {
        return 301 /Sprint-01/slide.html;
    }

    location ~* ^/sprint-02/?$ {
        return 301 /Sprint-02/slide.html;
    }

    location ~* ^/sprint-03/?$ {
        return 301 /Sprint-03/;
    }

    location ~* ^/sprint-04/?$ {
        return 301 /Sprint-04/;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error Page
    error_page 404 /index.html;
}
